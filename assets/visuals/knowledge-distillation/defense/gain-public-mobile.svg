<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730" font-family="Times New Roman, Georgia, serif" fill="#293241" role="img" aria-labelledby="kd-defense-gain-public-mobile-title kd-defense-gain-public-mobile-desc"><title id="kd-defense-gain-public-mobile-title">Paired experiment gains: public domain</title><desc id="kd-defense-gain-public-mobile-desc">Approximate two-sided 95% paired-t confidence interval, reconstructed from reported rounded mean differences and t statistics. Not standard deviation. Eight horizontal bars retain the source means and t statistics, with separate baseline groups and a common horizontal scale across public and private panels. Pale bars are not significant; hatched bars are shuffled-supervision controls.</desc><defs><pattern id="kd-defense-gain-public-mobile-hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#9aa6b6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5b6470" stroke-width="1.6"/></pattern></defs><text x="20" y="26" font-size="21" font-weight="bold">Public domain</text><text x="20" y="47" font-size="14" fill="#52606d">Gain over each matched no-KD baseline</text><text x="20" y="73" font-size="14" font-weight="bold">Head-output route · E0 baseline</text><line x1="20" y1="436" x2="340" y2="436" stroke="#9aa6b6" stroke-dasharray="5 4"/><text x="20" y="459" font-size="14" font-weight="bold">Offline-label route · E0noaug baseline</text><text x="20" y="478" font-size="12.5" fill="#52606d">Different baseline; compare within each route.</text><g id="kd-defense-gain-public-mobile-E1"><title>Uniform weighting (E1): reported gain 0.003; approximate 95% paired-t interval -0.00299 to 0.00899; not significant at 0.05.</title><text x="20" y="90" font-size="14.5">Uniform weighting</text><text x="340" y="90" font-size="12" text-anchor="end" fill="#52606d">E1</text><line x1="20.00" x2="20.00" y1="105" y2="127" stroke="#e6eaf0" stroke-width="1"/><lin