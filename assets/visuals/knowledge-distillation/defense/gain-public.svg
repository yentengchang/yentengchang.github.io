<svg font-family="Times New Roman, Georgia, serif" fill="#293241" width="548" height="452" viewBox="0 0 548 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kd-defense-gain-public-title kd-defense-gain-public-desc"><title id="kd-defense-gain-public-title">Gain over matched baselines: public domain</title><desc id="kd-defense-gain-public-desc">Approximate two-sided 95% paired-t confidence interval, reconstructed from reported rounded mean differences and t statistics. Not standard deviation. Pale bars are not significant at the 0.05 level; hatched bars are shuffled-supervision controls. The first six bars use the E0 baseline and the final two use E0noaug. The gray seed-variation band from the slide was removed because it is not a common noise estimate for both domains.</desc><defs><pattern id="kd-defense-gain-public-hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#9aa6b6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5b6470" stroke-width="1.6"/></pattern></defs><text x="305" y="18" font-size="17" font-weight="bold" text-anchor="middle">(a) Public domain</text><text x="247" y="39" font-size="15" fill="#52606d" text-anchor="middle">Same architecture</text><text x="478" y="39" font-size="15" fill="#52606d" text-anchor="middle">Cross</text><line x1="74" y1="354.3" x2="536" y2="354.3" stroke="#e6eaf0" stroke-width="1"/><text x="66" y="359.3" font-size="14" fill="#52606d" text-anchor="end">-0.02</text><line x1="74" y1="301.5" x2="536" y2="301.5" stroke="#e6eaf0" stroke-width="1"/><text x="66" y="306.5" font-size="14" fill="#52606d" text-anchor="end">-0.01</text><line x1="74" y1="248.7" x2="536" y2="248.7" stroke="#e6eaf0" stroke-width="1"/><text x="66" y="253.7" font-size="14" fill="#52606d" text-anchor="end">0.00</text><line x1="74" y1="195.9" x2="536" y2="195.9" stroke="#e6eaf0" stroke-width="1"/><text x="66" y="200.9" font-size="14" fill="#52606d" text-anchor="end">0.01</text><line x